<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - CIT Community Service Tracker</title>
    <link rel="icon" href="{{ url_for('static', filename='imgs/cit_logo_small.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="{{ url_for('static', filename='imgs/cit_logo_small.png') }}" alt="College of Information Technology seal">
                <div class="logo-text">CIT Community Service Tracker</div>
                <div class="logo-org">University of La Salette · College of Information Technology</div>
            </div>

            <h1>Welcome back</h1>
            <p class="subtitle">Sign in to your account</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="flash-messages {{ category }}" role="alert">
                <p>{{ message }}</p>
            </div>
            {% endfor %}
            {% endwith %}

            <form method="post">
                <div class="form-row">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required autofocus>
                </div>
                <div class="form-row">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
                <button class="btn-login" type="submit">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
