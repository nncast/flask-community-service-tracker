<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CIT CST</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <span class="logo-icon">
                    <img src="{{ url_for('static', filename='imgs/cit_logo.png') }}" alt="Logo">
                </span>
                <div class="logo-text">CIT Community Service Tracker</div>
            </div>

            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to your account</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="flash-messages {{ category }}" role="alert">
                <p>{{ message }}</p>
            </div>
            {% endfor %}
            {% endwith %}

            <form method="post">
                <div class="form-row">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required autofocus>
                </div>
                <div class="form-row">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
                <button class="btn-login" type="submit">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
