[project]
name = "cit-community-service-tracker"
version = "0.2.0"
description = "Tracks community service attendance and owed hours for the University of La Salette College of Information Technology."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask==2.3.3",
    "Werkzeug==2.3.8",
    "Flask-SQLAlchemy==3.0.5",
    "Flask-Migrate==4.0.4",
    "SQLAlchemy>=2.0.41,<2.2",
]

[tool.uv]
# A web app, not an installable package.
package = false
